name: OpenAPI

on:
  # Temporarily pause automatic validation during SABR profiling.
  # push:
  #   branches: ["dev"]
  # pull_request:
  #   branches: ["dev", "main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: openapi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, ci-stack]
    steps:
      - uses: actions/checkout@v7
      - name: Isolate Gradle user home
        run: echo "GRADLE_USER_HOME=${RUNNER_TEMP}/gradle-user-home" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate OpenAPI
        run: ./gradlew validateOpenApi
