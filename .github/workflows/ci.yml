name: CI

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev", "main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64","r730"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Isolate Gradle user home
        run: echo "GRADLE_USER_HOME=${RUNNER_TEMP}/gradle-user-home" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --max-workers=8
