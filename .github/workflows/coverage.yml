name: Coverage

on:
  pull_request:
    branches: ["dev", "main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64","r730"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Isolate Gradle user home
        run: echo "GRADLE_USER_HOME=${RUNNER_TEMP}/gradle-user-home" >> "$GITHUB_ENV"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      - name: Run tests and coverage report
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-html-report
          path: build/reports/jacoco/test/html

      - name: Upload coverage XML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-xml-report
          path: build/reports/jacoco/test/jacocoTestReport.xml
