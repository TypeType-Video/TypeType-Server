YoutubeSabrStreams:
  get:
    tags: [extraction]
    summary: Resolve YouTube playback metadata with HLS for live streams and SABR for VOD
    parameters:
      - name: url
        in: query
        required: true
        schema: { type: string }
    responses:
      '200':
        description: Live streams contain only an HLS manifest; VOD responses contain only SABR sources.
        headers:
          X-Request-ID:
            $ref: ../components/common.yaml#/RequestIdHeader
        content:
          application/json:
            schema:
              $ref: ../components/streams.yaml#/StreamResponse
      '400':
        description: Invalid request or YouTube account connection required (`youtube_session_required`).
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/ErrorResponse
      '401':
        $ref: ../components/common.yaml#/JsonError
      '403':
        $ref: ../components/common.yaml#/JsonError
      '404':
        description: YouTube reports that this video is unavailable.
        headers:
          X-Request-ID:
            $ref: ../components/common.yaml#/RequestIdHeader
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/ErrorResponse
      '409':
        description: The live event or premiere has not started yet.
        headers:
          X-Request-ID:
            $ref: ../components/common.yaml#/RequestIdHeader
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/ErrorResponse
      '502':
        description: YouTube extraction failed or returned no playable stream.
        headers:
          X-Request-ID:
            $ref: ../components/common.yaml#/RequestIdHeader
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/ErrorResponse
      '503':
        description: YouTube is temporarily rejecting requests from this server.
        headers:
          X-Request-ID:
            $ref: ../components/common.yaml#/RequestIdHeader
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/ErrorResponse
