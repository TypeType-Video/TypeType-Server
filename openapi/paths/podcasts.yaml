Podcasts:
  get:
    tags: [extraction]
    summary: Get YouTube channel podcasts and episodes
    parameters:
      - name: url
        in: query
        required: true
        schema: { type: string }
      - name: nextpage
        in: query
        required: false
        schema: { type: string }
    responses:
      '200':
        description: YouTube podcasts tab page.
        headers:
          X-Request-ID:
            $ref: ../components/common.yaml#/RequestIdHeader
        content:
          application/json:
            schema:
              $ref: ../components/media.yaml#/PodcastPageResponse
      '400':
        $ref: ../components/common.yaml#/JsonError
      '422':
        $ref: ../components/common.yaml#/JsonError
      '429':
        $ref: ../components/common.yaml#/RetryableError
      '503':
        $ref: ../components/common.yaml#/RetryableError
      '504':
        $ref: ../components/common.yaml#/UpstreamTimeoutError
PodcastEpisodes:
  get:
    tags: [extraction]
    summary: Get YouTube podcast playlist episodes
    parameters:
      - name: url
        in: query
        required: true
        schema: { type: string }
      - name: nextpage
        in: query
        required: false
        schema: { type: string }
    responses:
      '200':
        description: YouTube podcast playlist episodes.
        headers:
          X-Request-ID:
            $ref: ../components/common.yaml#/RequestIdHeader
        content:
          application/json:
            schema:
              $ref: ../components/media.yaml#/PodcastEpisodesResponse
      '400':
        $ref: ../components/common.yaml#/JsonError
      '422':
        $ref: ../components/common.yaml#/JsonError
      '429':
        $ref: ../components/common.yaml#/RetryableError
      '503':
        $ref: ../components/common.yaml#/RetryableError
      '504':
        $ref: ../components/common.yaml#/UpstreamTimeoutError
