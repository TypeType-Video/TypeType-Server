Notifications:
  get:
    tags: [user-data]
    summary: List new videos from the current profile's subscriptions
    security: [{ bearerAuth: [] }]
    parameters:
      - name: page
        in: query
        required: false
        schema: { type: integer, minimum: 0, default: 0 }
      - name: limit
        in: query
        required: false
        schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    responses:
      '200':
        description: Profile-scoped notifications. available is false when the feed could not be refreshed.
        content:
          application/json:
            schema: { $ref: ../components/notifications.yaml#/NotificationsResponse }
      '401': { $ref: ../components/common.yaml#/JsonError }

NotificationsUnreadCount:
  get:
    tags: [user-data]
    summary: Read the current profile's unread notification count
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: Unread count and feed availability.
        content:
          application/json:
            schema: { $ref: ../components/notifications.yaml#/UnreadCountResponse }
      '401': { $ref: ../components/common.yaml#/JsonError }

NotificationsReadAll:
  post:
    tags: [user-data]
    summary: Mark all current-profile notifications as read
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: Read marker and resulting unread count.
        content:
          application/json:
            schema: { $ref: ../components/notifications.yaml#/MarkNotificationsReadResponse }
      '401': { $ref: ../components/common.yaml#/JsonError }
