Search:
  get:
    tags: [extraction]
    summary: Search videos by service
    parameters:
      - name: q
        in: query
        required: true
        schema: { type: string }
      - name: service
        in: query
        required: true
        schema: { type: integer, enum: [0, 3, 4, 5, 6] }
      - name: nextpage
        in: query
        required: false
        schema: { type: string }
      - name: contentFilter
        in: query
        required: false
        schema: { type: string }
      - name: sortFilter
        in: query
        required: false
        deprecated: true
        description: Legacy single-filter parameter. Use `filter` for grouped selections.
        schema: { type: string }
      - name: filter
        in: query
        required: false
        description: Repeat for each selected search filter.
        style: form
        explode: true
        schema:
          type: array
          items: { type: string }
    responses:
      '200':
        description: Search page.
        headers:
          X-Request-ID:
            $ref: ../components/common.yaml#/RequestIdHeader
        content:
          application/json:
            schema:
              $ref: ../components/media.yaml#/SearchPageResponse
      '400':
        $ref: ../components/common.yaml#/JsonError
      '422':
        $ref: ../components/common.yaml#/JsonError
      '429':
        $ref: ../components/common.yaml#/RetryableError
      '503':
        $ref: ../components/common.yaml#/RetryableError
      '504':
        $ref: ../components/common.yaml#/UpstreamTimeoutError
SearchFilters:
  get:
    tags: [extraction]
    summary: Get search filters by service
    parameters:
      - name: service
        in: query
        required: true
        schema: { type: integer, enum: [0, 3, 4, 5, 6] }
      - name: contentFilter
        in: query
        required: false
        description: Return filter groups applicable to this content type.
        schema: { type: string }
    responses:
      '200':
        description: Search filter capabilities.
        headers:
          X-Request-ID:
            $ref: ../components/common.yaml#/RequestIdHeader
        content:
          application/json:
            schema:
              $ref: ../components/media.yaml#/SearchFiltersResponse
      '400':
        $ref: ../components/common.yaml#/JsonError
      '422':
        $ref: ../components/common.yaml#/JsonError
      '429':
        $ref: ../components/common.yaml#/RetryableError
      '503':
        $ref: ../components/common.yaml#/RetryableError
      '504':
        $ref: ../components/common.yaml#/UpstreamTimeoutError
