Playlist:
  get:
    tags: [extraction]
    summary: Get public YouTube playlist videos
    parameters:
      - name: url
        in: query
        required: true
        schema: { type: string }
      - name: nextpage
        in: query
        required: false
        schema: { type: string }
    responses:
      '200':
        description: Public YouTube playlist page.
        headers:
          X-Request-ID:
            $ref: ../components/common.yaml#/RequestIdHeader
        content:
          application/json:
            schema:
              $ref: ../components/media.yaml#/PublicPlaylistResponse
      '400':
        $ref: ../components/common.yaml#/JsonError
      '422':
        $ref: ../components/common.yaml#/JsonError
      '429':
        $ref: ../components/common.yaml#/RetryableError
      '503':
        $ref: ../components/common.yaml#/RetryableError
      '504':
        $ref: ../components/common.yaml#/UpstreamTimeoutError
