Focus:
  get:
    tags: [user-data]
    summary: Read the focus mode of the current profile
    parameters:
      - name: timezone
        in: query
        required: false
        schema: { type: string }
    responses:
      '200':
        description: Focus settings and progress.
        content:
          application/json:
            schema: { $ref: ../components/focus.yaml#/FocusSettingsItem }
      '401': { $ref: ../components/common.yaml#/JsonError }
  put:
    tags: [user-data]
    summary: Turn the focus mode on, schedule its exit, or change it while off
    description: Settings only change while the mode is off. While it is on, enabled false schedules the exit one day later.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/focus.yaml#/FocusSettingsRequest }
    responses:
      '200':
        description: Focus settings after the change.
        content:
          application/json:
            schema: { $ref: ../components/focus.yaml#/FocusSettingsItem }
      '400': { $ref: ../components/common.yaml#/JsonError }
      '401': { $ref: ../components/common.yaml#/JsonError }
FocusStudyChannels:
  post:
    tags: [user-data]
    summary: Subscribe to a channel if needed and add it to the profile's study group
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/focus.yaml#/FocusStudyChannelRequest }
    responses:
      '200':
        description: Study channel addition status and optional cooling-off unlock timestamp.
        content:
          application/json:
            schema: { $ref: ../components/focus.yaml#/FocusStudyChannelResponse }
      '400': { $ref: ../components/common.yaml#/JsonError }
      '401': { $ref: ../components/common.yaml#/JsonError }
      '409': { $ref: ../components/common.yaml#/JsonError }
  delete:
    tags: [user-data]
    summary: Remove a channel from the profile's study group
    parameters:
      - name: url
        in: query
        required: true
        schema: { type: string }
    responses:
      '204': { description: Channel removed from study group. }
      '400': { $ref: ../components/common.yaml#/JsonError }
      '401': { $ref: ../components/common.yaml#/JsonError }
      '404': { $ref: ../components/common.yaml#/JsonError }
FocusAllowOnceChallenge:
  post:
    tags: [user-data]
    summary: Issue a one-time verification string challenge to temporarily allow playback of one blocked video
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/focus.yaml#/FocusAllowOnceChallengeRequest }
    responses:
      '200':
        description: One-time verification string and remaining daily allow-once quota.
        content:
          application/json:
            schema: { $ref: ../components/focus.yaml#/FocusAllowOnceChallengeResponse }
      '400': { $ref: ../components/common.yaml#/JsonError }
      '401': { $ref: ../components/common.yaml#/JsonError }
      '409': { $ref: ../components/common.yaml#/JsonError }
FocusAllowOnceVerify:
  post:
    tags: [user-data]
    summary: Verify a focus allow-once string challenge and unlock playback for that single video
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/focus.yaml#/FocusAllowOnceVerifyRequest }
    responses:
      '200':
        description: Updated remaining daily quota and temporary video unlock expiry.
        content:
          application/json:
            schema: { $ref: ../components/focus.yaml#/FocusAllowOnceVerifyResponse }
      '400': { $ref: ../components/common.yaml#/JsonError }
      '401': { $ref: ../components/common.yaml#/JsonError }
      '409': { $ref: ../components/common.yaml#/JsonError }
FocusAllowOncePending:
  delete:
    tags: [user-data]
    summary: Cancel a pending allow-once cooling-off grant and restore that daily pass
    parameters:
      - name: url
        in: query
        required: true
        schema: { type: string }
      - name: timezone
        in: query
        required: false
        schema: { type: string }
    responses:
      '200':
        description: Updated remaining daily quota after cancellation.
        content:
          application/json:
            schema: { $ref: ../components/focus.yaml#/FocusAllowOnceCancelResponse }
      '400': { $ref: ../components/common.yaml#/JsonError }
      '401': { $ref: ../components/common.yaml#/JsonError }
      '404': { $ref: ../components/common.yaml#/JsonError }
FocusAiReview:
  post:
    tags: [user-data]
    summary: Submit a user reason for AI Focus review of a restricted or rewatched video
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/focus.yaml#/FocusAiReviewRequest }
    responses:
      '200':
        description: AI review verdict (approved, rejected, or unavailable).
        content:
          application/json:
            schema: { $ref: ../components/focus.yaml#/FocusAiReviewResponse }
      '400': { $ref: ../components/common.yaml#/JsonError }
      '401': { $ref: ../components/common.yaml#/JsonError }
      '409': { $ref: ../components/common.yaml#/JsonError }
