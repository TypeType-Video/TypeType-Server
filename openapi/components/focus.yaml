FocusSettingsItem:
  type: object
  required: [enabled, schedule, transitionDays, archiveDays, entertainmentShare]
  properties:
    enabled: { type: boolean, description: Stays true until disableAt passes. }
    entertainmentGroupId: { type: string, nullable: true, description: Subscription group whose channels fade out. }
    studyGroupId: { type: string, nullable: true, description: Subscription group shown first on the home. }
    schedule: { type: string, enum: [always, weekdays], description: weekdays pauses focus on Saturday and Sunday. }
    timezone: { type: string, nullable: true, description: IANA timezone used by the weekdays schedule. }
    transitionDays: { type: integer, minimum: 1, maximum: 365, description: Days for the group to fade from the home and the subscription feed. }
    archiveDays: { type: integer, minimum: 1, maximum: 365, description: Channel pages of the group only list videos from these last days. }
    strictBlocking: { type: boolean, default: false, description: Restrict playback, channels, and feeds outside the active study group while focus is active. }
    grayscaleThumbnails: { type: boolean, default: false, description: Render non-study video thumbnails in grayscale while focus is active. }
    startedAt: { type: integer, format: int64, nullable: true }
    disableAt: { type: integer, format: int64, nullable: true, description: When a requested exit takes effect. }
    entertainmentShare: { type: number, minimum: 0, maximum: 1, description: Share of the group's videos still shown. }
    active: { type: boolean, default: false, description: True when focus is enabled and active under the current schedule. }
    studyChannelKeys: { type: array, items: { type: string }, default: [], description: Normalized channel keys currently active in the study group. }
    allowOnceRemainingToday: { type: integer, minimum: 0, default: 3, description: Remaining single-video allow-once passes for today. }
    allowOnceDailyLimit: { type: integer, minimum: 1, default: 3, description: Daily maximum of single-video allow-once passes. }
FocusSettingsRequest:
  type: object
  required: [enabled]
  properties:
    enabled: { type: boolean, description: False while active schedules the exit one day later; true cancels it. }
    entertainmentGroupId: { type: string, nullable: true }
    studyGroupId: { type: string, nullable: true, description: An empty string clears the study group. }
    schedule: { type: string, enum: [always, weekdays] }
    timezone: { type: string, nullable: true }
    transitionDays: { type: integer, minimum: 1, maximum: 365 }
    archiveDays: { type: integer, minimum: 1, maximum: 365 }
    strictBlocking: { type: boolean }
    grayscaleThumbnails: { type: boolean }
FocusStudyChannelRequest:
  type: object
  required: [channelUrl]
  properties:
    channelUrl: { type: string }
    name: { type: string, default: "" }
    avatarUrl: { type: string, default: "" }
FocusStudyChannelResponse:
  type: object
  required: [channelUrl, status]
  properties:
    channelUrl: { type: string }
    status: { type: string, enum: [active, pending] }
    unlockAt: { type: integer, format: int64, nullable: true }
FocusAllowOnceChallengeRequest:
  type: object
  required: [videoUrl]
  properties:
    videoUrl: { type: string }
    timezone: { type: string, nullable: true }
FocusAllowOnceChallengeResponse:
  type: object
  required: [challengeId, challengeText, expiresAt, remainingToday, dailyLimit]
  properties:
    challengeId: { type: string }
    challengeText: { type: string, description: Exact verification string the user must type identically. }
    expiresAt: { type: integer, format: int64 }
    remainingToday: { type: integer, minimum: 0 }
    dailyLimit: { type: integer, minimum: 1 }
FocusAllowOnceVerifyRequest:
  type: object
  required: [challengeId, videoUrl, code]
  properties:
    challengeId: { type: string }
    videoUrl: { type: string }
    code: { type: string }
    timezone: { type: string, nullable: true }
FocusAllowOnceVerifyResponse:
  type: object
  required: [remainingToday, dailyLimit, expiresAt]
  properties:
    remainingToday: { type: integer, minimum: 0 }
    dailyLimit: { type: integer, minimum: 1 }
    expiresAt: { type: integer, format: int64 }
