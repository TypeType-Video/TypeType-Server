HealthResponse:
  type: object
  required: [status]
  properties:
    status: { type: string, example: ok }
ErrorResponse:
  type: object
  required: [error]
  properties:
    error: { type: string }
    code:
      type: string
      default: error
      description: >-
        Stable machine-readable error code when available. Playback extraction
        routes may return geographic_restriction, provider_access_blocked,
        private_content, no_playable_streams, age_restricted, scheduled_premiere,
        paid_content, members_only, or youtube_session_required.
    requestId: { type: string, nullable: true }
RequestIdHeader:
  description: Request correlation id returned by TypeType-Server.
  schema: { type: string }
JsonError:
  description: Request failed.
  headers:
    X-Request-ID:
      $ref: '#/RequestIdHeader'
  content:
    application/json:
      schema:
        $ref: '#/ErrorResponse'
