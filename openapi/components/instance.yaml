InstanceMinClientVersion:
  type: object
  required: [android]
  properties:
    android:
      type: string
      nullable: true
InstanceResponse:
  type: object
  required:
    - name
    - version
    - apiVersion
    - registrationAllowed
    - guestAllowed
    - supportedServices
    - minClientVersion
    - localLoginEnabled
    - oidcEnabled
    - oidcAutoRedirect
    - youtubeRemoteLoginEnabled
    - youtubeRemoteLoginReady
    - parentalControlsEnabled
    - rss
    - pushNotifications
  properties:
    name: { type: string, example: TypeType }
    tagline: { type: string, nullable: true }
    version: { type: string, example: 0.0.1 }
    apiVersion: { type: integer, example: 1 }
    registrationAllowed: { type: boolean }
    guestAllowed: { type: boolean }
    supportedServices:
      type: array
      items: { type: integer }
      example: [0, 3, 4, 5, 6]
    minClientVersion:
      $ref: '#/InstanceMinClientVersion'
    logoUrl: { type: string, nullable: true }
    bannerUrl: { type: string, nullable: true }
    localLoginEnabled: { type: boolean }
    oidcEnabled: { type: boolean }
    oidcProviderName: { type: string, nullable: true }
    oidcAutoRedirect: { type: boolean }
    youtubeRemoteLoginEnabled:
      type: boolean
      description: True only when the admin setting is enabled and remote login is ready.
    youtubeRemoteLoginReady:
      type: boolean
      description: True when Token accepts the shared secret and callback and its browser runtime is available.
    youtubeRemoteLoginUnavailableReason:
      type: string
      nullable: true
      enum: [disabled, not_configured, token_unreachable]
    parentalControlsEnabled:
      type: boolean
      description: True when the instance-wide allow-list policy is enabled.
    rss:
      $ref: '#/RssInstanceCapability'
    pushNotifications:
      $ref: '#/PushNotificationCapability'
RssInstanceCapability:
  type: object
  required: [enabled, maxFeedsPerUser, maxItems, minimumPollMinutes, rateLimitPerMinute]
  properties:
    enabled: { type: boolean }
    maxFeedsPerUser: { type: integer }
    maxItems: { type: integer }
    minimumPollMinutes: { type: integer }
    rateLimitPerMinute: { type: integer }

PushNotificationCapability:
  type: object
  required: [enabled, provider, eventTypes, maxDevicesPerAccount]
  properties:
    enabled: { type: boolean }
    provider: { type: string, enum: [unifiedpush] }
    eventTypes:
      type: array
      items: { type: string }
    maxDevicesPerAccount: { type: integer, minimum: 0 }
