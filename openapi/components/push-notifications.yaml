PushDeviceRegistrationRequest:
  type: object
  required: [deviceId, endpoint, p256dh, auth]
  properties:
    deviceId: { type: string, minLength: 1, maxLength: 128 }
    platform: { type: string, enum: [android], default: android }
    endpoint: { type: string, format: uri, minLength: 1, maxLength: 2048 }
    p256dh: { type: string, minLength: 1, maxLength: 128, description: Base64url-encoded uncompressed P-256 subscription public key used for RFC 8291 encryption }
    auth: { type: string, minLength: 1, maxLength: 128, description: Base64url-encoded 16-byte subscription authentication secret used for RFC 8291 encryption }
    expiresAt: { type: integer, format: int64, nullable: true }
PushDeviceRegistrationResponse:
  type: object
  required: [id, deviceId, platform, expiresAt, updatedAt]
  properties:
    id: { type: string }
    deviceId: { type: string }
    platform: { type: string, enum: [android] }
    expiresAt: { type: integer, format: int64, nullable: true }
    updatedAt: { type: integer, format: int64 }
PushDeliveryAcknowledgementRequest:
  type: object
  required: [eventId, deviceId, outcome]
  properties:
    eventId: { type: string, pattern: '^[a-f0-9]{64}$' }
    deviceId: { type: string, minLength: 1, maxLength: 128 }
    outcome: { type: string, enum: [posted, suppressed, failed] }
    reasonCode: { type: string, nullable: true, pattern: '^[a-z_]{1,64}$' }
ChannelNotificationPreferenceRequest:
  type: object
  required: [channelUrl, enabled]
  properties:
    channelUrl: { type: string, minLength: 1 }
    enabled: { type: boolean }
ChannelNotificationPreferencesBulkRequest:
  type: object
  required: [enabled]
  properties:
    enabled: { type: boolean }
    channelUrls:
      type: array
      items: { type: string }

ChannelNotificationPreference:
  type: object
  required: [channelUrl, enabled, updatedAt]
  properties:
    channelUrl: { type: string }
    enabled: { type: boolean }
    updatedAt: { type: integer, format: int64 }
UnifiedPushNotificationPayload:
  type: object
  required:
    - version
    - eventType
    - serviceId
    - serviceName
    - eventId
    - videoId
    - videoUrl
    - channelId
    - channelName
    - channelAvatarUrl
    - instanceId
    - accountId
    - publishedAt
    - title
  properties:
    version: { type: integer, minimum: 1 }
    eventType: { type: string, enum: [subscription_new_video] }
    serviceId: { type: integer, minimum: 0 }
    serviceName: { type: string }
    eventId: { type: string }
    videoId: { type: string }
    videoUrl: { type: string }
    channelId: { type: string }
    channelName: { type: string }
    channelAvatarUrl: { type: string }
    instanceId: { type: string }
    accountId: { type: string }
    publishedAt: { type: integer, format: int64 }
    title: { type: string }
    thumbnailUrl: { type: string, description: Upstream video thumbnail URL, empty when unknown. }
