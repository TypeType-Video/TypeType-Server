clone:
  git:
    image: woodpeckerci/plugin-git:2.10.0@sha256:0f06b03ec33137b556c77538563f66c400339052d0c5199d4c3ad1a2a37e1964
    settings:
      partial: false
      depth: 0
      tags: true

when:
  - event: push
    branch: dev
  - event: tag
  - event: manual

services:
  docker:
    image: docker:29.1.3-dind@sha256:64d6ee47ea821c986467199baa162f5ac8cde3f57b719f18e23f3ed7a7444131
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    commands:
      - dockerd-entrypoint.sh --host=tcp://0.0.0.0:2375 --tls=false --insecure-registry=registry:5000

steps:
  - name: wait-docker
    image: docker:29.1.3-cli@sha256:e0b6ff45302985d99b9685b2a2fec50c3379bd47067493968f51da901dc53ad5
    environment:
      DOCKER_HOST: tcp://docker:2375
    commands:
      - |
        for attempt in $$(seq 1 60); do
          if docker info >/dev/null 2>&1; then
            exit 0
          fi
          sleep 1
        done
        exit 1

  - name: prepare
    image: woodpeckerci/plugin-git:2.10.0@sha256:0f06b03ec33137b556c77538563f66c400339052d0c5199d4c3ad1a2a37e1964
    commands:
      - |
        set -eu
        tag_name="$${CI_COMMIT_TAG:-}"
        if [ "$${CI_PIPELINE_EVENT}" = "manual" ] && [ "$${CI_COMMIT_BRANCH:-}" != "dev" ]; then
          tag_name="$$(git describe --tags --exact-match --match 'v[0-9]*' 2>/dev/null || true)"
          if [ -z "$${tag_name}" ]; then
            echo "A manual build outside dev needs a version tag on its commit" >&2
            exit 1
          fi
        fi

        if [ -n "$${tag_name}" ]; then
          version="$${tag_name#v}"
          if printf '%s\n' "$${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$$'; then
            tags="$${version} latest"
          elif printf '%s\n' "$${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$$'; then
            tags="$${version} rc"
          else
            echo "Version tags look like v1.2.3 or v1.2.3-rc.1, got $${tag_name}" >&2
            exit 1
          fi
          local_repo=registry:5000/typetype/server
          ghcr_repo=ghcr.io/typetype-video/typetype-server
        else
          release="$$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || echo v0.0.0)"
          version="$${release#v}-beta.$${CI_PIPELINE_NUMBER}"
          local_repo=registry:5000/typetype/server-beta
          ghcr_repo=ghcr.io/typetype-video/typetype-server-beta
          tags="dev beta latest $${version}"
        fi

        {
          printf "VERSION='%s'\n" "$${version}"
          printf "LOCAL_REPO='%s'\n" "$${local_repo}"
          printf "GHCR_REPO='%s'\n" "$${ghcr_repo}"
          printf "TAGS='%s'\n" "$${tags}"
        } > .woodpecker-publish.env

  - name: publish-amd64
    image: docker:29.1.3-cli@sha256:e0b6ff45302985d99b9685b2a2fec50c3379bd47067493968f51da901dc53ad5
    depends_on: [wait-docker, prepare]
    environment:
      DOCKER_HOST: tcp://docker:2375
      GHCR_USER:
        from_secret: ghcr_username
      GHCR_TOKEN:
        from_secret: ghcr_token
      LOCAL_REGISTRY_PASSWORD:
        from_secret: local_registry_password
    commands:
      - |
        set -eu
        set -a
        . ./.woodpecker-publish.env
        set +a
        build_time="$$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        printf '%s' "$${GHCR_TOKEN}" |
          docker login ghcr.io -u "$${GHCR_USER}" --password-stdin
        printf '%s' "$${LOCAL_REGISTRY_PASSWORD}" |
          docker login registry:5000 -u ci --password-stdin

        docker build --pull --platform linux/amd64 \
          --provenance=false --sbom=false \
          --build-arg "APP_VERSION=$${VERSION}" \
          --build-arg "GITHUB_SHA=$${CI_COMMIT_SHA}" \
          --build-arg "BUILD_TIME=$${build_time}" \
          -t "$${LOCAL_REPO}:$${VERSION}" .

        for tag in $${TAGS}; do
          docker tag "$${LOCAL_REPO}:$${VERSION}" "$${LOCAL_REPO}:$${tag}"
          docker tag "$${LOCAL_REPO}:$${VERSION}" "$${LOCAL_REPO}:$${tag}-amd64"
          docker tag "$${LOCAL_REPO}:$${VERSION}" "$${GHCR_REPO}:$${tag}"
          docker tag "$${LOCAL_REPO}:$${VERSION}" "$${GHCR_REPO}:$${tag}-amd64"
        done

        for tag in $${TAGS}; do
          docker push "$${LOCAL_REPO}:$${tag}"
          docker push "$${LOCAL_REPO}:$${tag}-amd64"
          docker push "$${GHCR_REPO}:$${tag}"
          docker push "$${GHCR_REPO}:$${tag}-amd64"
        done

        echo "Published $${VERSION} for linux/amd64"

  - name: publish-arm64
    image: docker:29.1.3-cli@sha256:e0b6ff45302985d99b9685b2a2fec50c3379bd47067493968f51da901dc53ad5
    depends_on: [wait-docker, prepare]
    when:
      - event: tag
      - event: manual
        branch:
          exclude: dev
    environment:
      DOCKER_HOST: tcp://docker:2375
      GHCR_USER:
        from_secret: ghcr_username
      GHCR_TOKEN:
        from_secret: ghcr_token
      LOCAL_REGISTRY_PASSWORD:
        from_secret: local_registry_password
    commands:
      - |
        set -eu
        set -a
        . ./.woodpecker-publish.env
        set +a
        build_time="$$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        printf '%s' "$${GHCR_TOKEN}" |
          docker login ghcr.io -u "$${GHCR_USER}" --password-stdin
        printf '%s' "$${LOCAL_REGISTRY_PASSWORD}" |
          docker login registry:5000 -u ci --password-stdin

        docker build --pull --platform linux/arm64 \
          --provenance=false --sbom=false \
          --build-arg "APP_VERSION=$${VERSION}" \
          --build-arg "GITHUB_SHA=$${CI_COMMIT_SHA}" \
          --build-arg "BUILD_TIME=$${build_time}" \
          -t "$${LOCAL_REPO}:$${VERSION}-arm64" .

        for tag in $${TAGS}; do
          docker tag "$${LOCAL_REPO}:$${VERSION}-arm64" "$${LOCAL_REPO}:$${tag}-arm64"
          docker tag "$${LOCAL_REPO}:$${VERSION}-arm64" "$${GHCR_REPO}:$${tag}-arm64"
        done

        for tag in $${TAGS}; do
          docker push "$${LOCAL_REPO}:$${tag}-arm64"
          docker push "$${GHCR_REPO}:$${tag}-arm64"
        done

        echo "Published $${VERSION} for linux/arm64"

  - name: publish-manifest
    image: docker:29.1.3-cli@sha256:e0b6ff45302985d99b9685b2a2fec50c3379bd47067493968f51da901dc53ad5
    depends_on: [publish-amd64, publish-arm64]
    when:
      - event: tag
      - event: manual
        branch:
          exclude: dev
    environment:
      DOCKER_HOST: tcp://docker:2375
      GHCR_USER:
        from_secret: ghcr_username
      GHCR_TOKEN:
        from_secret: ghcr_token
      LOCAL_REGISTRY_PASSWORD:
        from_secret: local_registry_password
    commands:
      - |
        set -eu
        set -a
        . ./.woodpecker-publish.env
        set +a
        printf '%s' "$${GHCR_TOKEN}" |
          docker login ghcr.io -u "$${GHCR_USER}" --password-stdin
        printf '%s' "$${LOCAL_REGISTRY_PASSWORD}" |
          docker login registry:5000 -u ci --password-stdin

        for tag in $${TAGS}; do
          docker manifest create --amend --insecure \
            "$${LOCAL_REPO}:$${tag}" \
            "$${LOCAL_REPO}:$${tag}-amd64" \
            "$${LOCAL_REPO}:$${tag}-arm64"
          docker manifest push --purge --insecure "$${LOCAL_REPO}:$${tag}"

          docker manifest create --amend \
            "$${GHCR_REPO}:$${tag}" \
            "$${GHCR_REPO}:$${tag}-amd64" \
            "$${GHCR_REPO}:$${tag}-arm64"
          docker manifest push --purge "$${GHCR_REPO}:$${tag}"
        done

        echo "Published $${VERSION} manifest for linux/amd64 and linux/arm64"
