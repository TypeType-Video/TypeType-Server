clone:
  git:
    image: woodpeckerci/plugin-git:2.10.0@sha256:0f06b03ec33137b556c77538563f66c400339052d0c5199d4c3ad1a2a37e1964
    settings:
      partial: false
      depth: 0
      fetch-target-branch: true

when:
  - event: push
    branch: [dev, main]
  - event: pull_request
  - event: manual

services:
  postgres:
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    environment:
      POSTGRES_DB: typetype
      POSTGRES_USER: typetype
      POSTGRES_PASSWORD: typetype-ci-only

steps:
  - name: wait-postgres
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    environment:
      PGHOST: postgres
      PGUSER: typetype
      PGPASSWORD: typetype-ci-only
      PGDATABASE: typetype
    commands:
      - |
        for attempt in $$(seq 1 60); do
          if pg_isready -q; then
            exit 0
          fi
          sleep 1
        done
        exit 1

  - name: gradle
    image: gradle:9.7.0-jdk25@sha256:24bfb4bc1b96afef848086d39a7f585c0b7217bf9581fa228a06ff305ecd9b20
    depends_on: [wait-postgres]
    environment:
      TEST_DATABASE_URL: jdbc:postgresql://postgres:5432/typetype
      TEST_DATABASE_USER: typetype
      TEST_DATABASE_PASSWORD: typetype-ci-only
    commands:
      - |
        set -eu
        export GITHUB_EVENT_NAME="$${CI_PIPELINE_EVENT}"
        export GITHUB_SHA="$${CI_COMMIT_SHA}"
        export GITHUB_EVENT_BEFORE="$${CI_PREV_COMMIT_SHA:-}"
        export GITHUB_BASE_REF="$${CI_COMMIT_TARGET_BRANCH:-}"
        export GITHUB_OUTPUT=/tmp/woodpecker-affected-tasks
        : >"$${GITHUB_OUTPUT}"
        if [ "$${FORCE_FULL_BUILD:-false}" = "true" ]; then
          tasks=build
        else
          bash .github/scripts/ci-affected-tasks.sh
          tasks="$(
            sed -n '/^tasks<<EOF$/,/^EOF$/p' "$${GITHUB_OUTPUT}" | sed '1d;$d'
          )"
        fi
        if [ -z "$${tasks}" ]; then
          echo "No Gradle compilation or tests are required."
          exit 0
        fi
        printf 'Running:\n%s\n' "$${tasks}"
        ./gradlew $${tasks} --parallel --max-workers=32
        ./gradlew validateOpenApi jacocoTestReport jacocoTestCoverageVerification \
          --parallel --max-workers=32
